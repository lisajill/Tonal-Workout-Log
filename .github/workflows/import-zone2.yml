name: Import Zone2 Workout

on:
  workflow_dispatch:
    inputs:
      workout_b64:
        description: 'Base64-encoded workout JSON'
        required: true
        type: string

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Write workout file
        run: echo "${{ inputs.workout_b64 }}" | base64 -d > pending/workout.json

      - name: Run import
        env:
          ZONE2_SOURCE_DIR: ${{ github.workspace }}/pending
        run: npm run import-zone2

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/zone2_log.json src/data/activities.json
          git diff --cached --quiet && echo "Nothing new to import" && exit 0
          git commit -m "Import Zone2 session from phone"
          git push
