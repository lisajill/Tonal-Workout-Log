name: Import Zone2 Workout

on:
  push:
    paths:
      - 'pending/*.json'

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run import
        env:
          ZONE2_SOURCE_DIR: ${{ github.workspace }}/pending
        run: npm run import-zone2

      - name: Remove processed files
        run: git rm pending/*.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/zone2_log.json src/data/activities.json
          git diff --cached --quiet && echo "Nothing new to import" && exit 0
          git commit -m "Import Zone2 session from phone"
          # Retry push on transient failures (e.g. GitHub 500s) so a single
          # infra hiccup can't strand the pending file unprocessed. Rebase
          # onto any commits that landed in between attempts.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying in 10s..."
            sleep 10
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Push failed after 5 attempts"
          exit 1
